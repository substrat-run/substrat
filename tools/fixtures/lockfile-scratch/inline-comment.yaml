# A trailing comment that names a scratch project, on an importer that is fine.
#
# The first cut stripped FULL-line comments and not inline ones, so this file was
# refused — and reported `packages/foo`, which has done nothing wrong, as the
# offender. A gate that names an innocent line is worse than one that says
# nothing: the next person to meet it learns to distrust it.
#
# The quoted `#` two entries down is the other half of the same rule and belongs
# to hash-in-quoted-value.yaml; here every `#` really does open a comment.
#
# Fixture for tools/lockfile-scratch.mjs — expected: 0 offences.
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      tsx:
        specifier: ^4.19.0
        version: 4.23.1

  # a whole-line comment naming .builder/projects/eval-fixline is still only a comment
  packages/foo: {} # see .builder/projects/local for why this one has no deps

  packages/kernel:
    dependencies:
      '@substrat-run/contracts':
        specifier: workspace:*
        version: link:../contracts
