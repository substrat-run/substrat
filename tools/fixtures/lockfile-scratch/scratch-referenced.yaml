# No scratch importer — and the directory name is in the public file anyway.
#
# A committed member that depends on a studio project resolves it as a `link:`
# into `.builder/projects/*`, so the path is written into the lockfile as a
# dependency version rather than as an importer key. Leaking the name is the
# thing this gate is about, so where in the file it appears does not change the
# answer.
#
# Fixture for tools/lockfile-scratch.mjs — expected: 1 offence.
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      tsx:
        specifier: ^4.19.0
        version: 4.23.1

  demos/callout:
    dependencies:
      '@substrat-run/scratch-fixline':
        specifier: workspace:*
        version: link:../../.builder/projects/eval-fixline

  packages/kernel:
    dependencies:
      '@substrat-run/contracts':
        specifier: workspace:*
        version: link:../contracts
