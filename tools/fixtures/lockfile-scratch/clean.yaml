# A committed lockfile with nothing to complain about: every importer is a
# directory that is actually in the repository.
#
# Fixture for tools/lockfile-scratch.mjs. Trimmed from the real pnpm-lock.yaml —
# the shape is pnpm's own, the dependency lists are cut short.
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      tsx:
        specifier: ^4.19.0
        version: 4.23.1

  demos/callout:
    dependencies:
      '@substrat-run/kernel':
        specifier: workspace:*
        version: link:../../packages/kernel

  demos/callout/app:
    dependencies:
      react:
        specifier: ^18.3.0
        version: 18.3.1

  packages/kernel:
    dependencies:
      '@substrat-run/contracts':
        specifier: workspace:*
        version: link:../contracts

  # An importer that resolved no dependencies, written inline — the shape pnpm gives
  # `packages/create-substrat` in the real lockfile. It is an importer like any other,
  # and the count this fixture is held to is what says so.
  packages/create-substrat: {}
