purpose:
  stands_in_for: GitHub token exchange, authenticated profile and email-list HTTP endpoints.
  unblocks: Regression testing of GitHub sign-in diagnostics and verified-email fallback without production accounts.
assumptions:
  - id: github-private-email-endpoint
    status: supported
    claim: GitHub can omit the profile email and expose private addresses through the separately authorized email-list endpoint.
    reason: The documented email endpoint and installed Better Auth adapter define the fixture shapes and calls.
    verification: The local simulator served token, profile and email traffic during sixteen callback and fallback tests; the private-email success case used the email-list response.
    source: https://docs.github.com/en/rest/users/emails#list-email-addresses-for-the-authenticated-user; ../mocks/github/handler.cjs; ../../test/github-sign-in-log.test.ts
    updated_at: "2026-10-28"
  - id: caller-verifies-fallback-email
    status: supported
    claim: The caller pauses for missing or mismatched email and resumes OIDC only after browser-bound, single-use mailbox verification.
    reason: Tests exercise the real auth handler against the HTTP simulation and inspect users, account bindings, sessions and OIDC redirects.
    verification: Sixteen tests passed, including expiry, replay, concurrent completion, existing-address collision, explicit linking and per-client/provider policy checks. Email delivery was captured with MockEmailTransport; no live GitHub account or mail delivery was tested.
    source: ../../src/github-email-plugin.ts; ../../test/github-sign-in-log.test.ts; sign-in-diagnostics.context.md
    updated_at: "2026-10-28"
  - id: optional-email-service-failures
    status: supported
    claim: With a valid authenticated GitHub profile, the caller can complete browser-bound mailbox verification after email transport failures, malformed responses or timeouts.
    reason: The real auth handler fetched the profile independently and treated the bounded email lookup as optional in the injected failure scenarios.
    verification: On 2026-10-28, all 27 GitHub callback and fallback tests passed through the local Postman simulation, including first-time verification and returning linked-account sign-in under each email failure. Rejected profile credentials did not create pending verification or a user. This establishes caller behavior against synthetic HTTP responses, not live GitHub availability or delivery.
    source: ../mocks/github/handler.cjs; ../../src/github-email-plugin.ts; ../../test/github-sign-in-log.test.ts; sign-in-diagnostics.context.md
    updated_at: "2026-10-28"
  - id: shared-identity-policy-preservation
    status: supported
    claim: In the exercised scenarios, fallback verification cannot replace an existing email routed to another provider by any enabled application on the issuer.
    reason: Regression tests store live client metadata and attempt the change through the originating application, an unrestricted application and direct issuer login.
    verification: On 2026-10-28, verification returned 403 without changing the user email for all three entry points and for a restricting application beyond the first registry page. Disabling the restriction allowed retry of the same proof at the issuer. Expired temporary bans permitted completion and were cleared, while permanent and future bans were refused without changing the email.
    source: ../../src/github-email-plugin.ts; ../../test/github-sign-in-log.test.ts
    updated_at: "2026-10-28"
