# Dependency update automation (#1590).
#
# ONE npm entry at `/` covers the whole pnpm workspace, and that is deliberate rather than a
# shortcut. Dependabot's npm updater reads `pnpm-workspace.yaml`, expands its `packages:` globs
# (`packages/*`, `engines/*`, `demos/*/app`, `apps/*/web`, …) and fetches every member's
# package.json alongside the one `pnpm-lock.yaml`; it also parses the `catalog:` block in
# `pnpm-workspace.yaml` as dependencies of their own. So the members are reached through the
# root, and a version bump lands as one PR that edits every manifest naming the dependency and
# regenerates the single lockfile.
#
# The trap is the opposite one: a per-directory entry (`/packages/kernel`, `/demos/todo`, …)
# resolves that member alone, against a lockfile it does not own, and opens a PR per member
# that disagrees with its siblings — which is exactly the drift `catalog:` exists to end.
# Do not add one. The `.builder/projects/*` members in the workspace globs are gitignored, so a
# checkout Dependabot reads has none of them.
#
# Not covered, on purpose: `examples/external-vertical` (not a workspace member — it proves
# an install from the registry works, so its pins are the published ones) and the
# `create-substrat` template, which has no package.json at all — `packages/create-substrat/index.js`
# writes one into each scaffolded project, and `pnpm lint:pins` keeps its ranges honest.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    # Routine bumps travel together: one PR a week for every minor and patch, instead of one per
    # package — sixty-odd manifests would otherwise be a stream of single-line PRs nobody reads.
    # A major does not arrive at all; see the first `ignore` entry below.
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # No major update, for any npm dependency, until a person asks for one. A major is a
      # migration, not an update: it changes an API, a peer range or a runtime requirement, so it
      # wants a person, a branch and a plan, and a bot-opened PR carries none of those. The first
      # run of this file opened NINE of them at once (zod 4, React, @types/node 26, the Vite
      # plugins, …), all red, on the day the config landed — which is how a scanner gets muted: a
      # checks column that is red by default trains everyone to stop reading it, and the one PR
      # that matters is then the one nobody looks at. To take a major, do it by hand in a PR of
      # its own.
      #
      # What this does NOT do: it removes the majors, not the red. A minor or patch can still
      # break the build (better-auth 1.7.5 is a patch, and it does: #1622), and a pre-1.0
      # package ships its breaking changes as a "minor".
      #
      # Deliberately NOT repeated on the `github-actions` entry below: an action pinned to a
      # major tag (`@v6`) never moves by minor or patch, so ignoring majors there would silence
      # that ecosystem entirely.
      #
      # Security: `ignore` is documented as applying to security updates too, so an advisory
      # whose only fix is a new major will not become a PR from this file. `audit.yml` still
      # names it — that reads the lockfile on every push and every Monday, independent of this.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
