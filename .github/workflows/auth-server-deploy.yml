name: Deploy to Substrat

# Generated by Substrat (substrat init --ci github). The workflow this encodes — one prod
# channel, previews as the only non-prod environment — is documented at
# https://substrat.net/guide/environments-and-previews
#
# Monorepo: this deploys the 'auth-server' vertical from demos/auth-server/. Dependencies still install
# at the repo root (the workspace lockfile lives there), and the workspace packages this
# vertical imports are built before every push — a sibling resolves through its dist/.
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   SUBSTRAT_TEST_SCOPE_ID      a long-lived scope rebound to every merge (the test env)
#
# EDITED AFTER GENERATION, in one respect: the PR-preview half is removed. A preview needs the
# platform to materialize its scope through the vertical's POST /internal/restore — a FORK
# restores the source's tables, and even a clean-room `--empty` preview calls restoreScope with
# an empty list to bring the DO into being. This issuer answers 501 to that verb by design
# (src/routes.ts: "every OTHER platform verb … is honestly unimplemented"), so every preview run
# failed at creation. Re-generating this file with `substrat init --ci github` brings the
# preview jobs back; delete them again, or implement /internal/restore first. Note what a fork
# would mean here even once it exists: a preview URL carrying a copy of prod's users, password
# hashes and JWKS signing keys.

# The default GITHUB_TOKEN, narrowed to what these jobs actually use. A repository whose
# default is read/write would otherwise hand every job below write access to issues, packages
# and the contents of the repo — none of which any of them touch. The one job that needs more
# needs nothing more: with the preview jobs removed below, no job here writes anything.
permissions:
  contents: read

on:
  push:
    branches: [main]
    # Only changes that can affect demos/auth-server deploy it. If this package depends on other
    # directories of the repo (workspace packages, shared config), add their paths here —
    # or remove the filter to build on every merge.
    paths:
      - 'demos/auth-server/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - 'package-lock.json'

jobs:
  deploy:
    # Trunk-based: every merge to main releases. A private vertical's push lands admitted
    # and prod is self-serve, so the same run points prod at the new version.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One promotion at a time, and every merge still gets one. Two merges landing together
    # would otherwise race, and the loser could point prod at the OLDER version — the channel
    # takes whichever push finishes last, not whichever commit is newer. Queued rather than
    # cancelled: a superseded deploy is still a version somebody has to be able to find, and
    # cancelling mid-push can leave a version uploaded but never promoted. `queue: max`
    # because the default (`queue: single`) holds ONE run pending, so a third merge arriving
    # evicts the second and that commit is never deployed at all — the same lost promotion the
    # group was added to prevent, reached from the other side. Up to 100 wait instead.
    #
    # Serialized and bounded is all of it, though — NOT ordered. GitHub queues by the time a
    # run starts waiting, and states outright that ordering is not guaranteed, so two runs can
    # still invert and leave prod running the older commit under a HIGHER version number
    # (`push` patch-bumps the registry's highest; it never reads the commit). Closing that
    # needs a guard refusing to promote a commit the branch has moved past — its own change.
    concurrency:
      group: substrat-deploy-auth-server-prod
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          # 22+: corepack resolves the latest pnpm for lockfile-only repos, and pnpm 11
          # needs Node >= 22.13 (node:sqlite).
          node-version: 22
      - name: Install dependencies
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install
          fi
      - name: Build workspace dependencies
        # Sibling packages resolve through their package.json exports, which point at dist/ —
        # a fresh checkout has none, and install links without building. pnpm and Yarn Berry
        # build in dependency order and skip packages without a build script (pnpm only the
        # closure this package imports). Yarn Classic and npm have no dependency order: Classic
        # runs every workspace's build and fails on one that has none; npm follows the order
        # package.json lists workspaces in, so list dependencies before dependents.
        # Delete this step if the package imports no workspace packages.
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm --filter "{demos/auth-server}^..." run --if-present build
          elif [ -f yarn.lock ] && ! yarn --version | grep -q '^1\.'; then yarn workspaces foreach --all --topological-dev --exclude 'demos/auth-server' run build
          elif [ -f yarn.lock ]; then yarn workspaces run build
          else npm run build --workspaces --if-present
          fi
      - name: Gate the push (typecheck, tests, layer rules)
        # Runs the gates demos/auth-server/package.json declares — a violation fails the job before anything
        # is uploaded. Add `test`, `typecheck` and `lint:boundaries` scripts to gate more;
        # `lint:boundaries` is `substrat-boundary-lint` from @substrat-run/boundary-lint.
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then PM=pnpm
          elif [ -f yarn.lock ]; then PM=yarn
          else PM=npm
          fi
          declares() { node -e "const s=require(process.cwd()+'/'+process.argv[1]).scripts||{};process.exit(s[process.argv[2]]?0:1)" 'demos/auth-server/package.json' "$1"; }
          RAN=''
          for s in typecheck test lint:boundaries; do
            if declares "$s"; then ( cd demos/auth-server && $PM run "$s" ); RAN="$RAN $s"
            else echo "no '$s' script in demos/auth-server/package.json — skipped"
            fi
          done
          if [ -z "$RAN" ]; then
            echo "::warning::no typecheck, test or lint:boundaries script in demos/auth-server/package.json — this push is UNGATED. See https://substrat.net/guide/deploying"
          else
            echo "gates passed:$RAN"
          fi
      - name: Release to prod
        env:
          SUBSTRAT_SERVICE_TOKEN: ${{ secrets.SUBSTRAT_SERVICE_TOKEN }}
          SUBSTRAT_CP_URL: https://console.substrat.net/api
        run: |
          set -euo pipefail
          npx @substrat-run/cli push demos/auth-server --slug auth-server --promote prod
      - name: Update the test environment
        if: vars.SUBSTRAT_TEST_SCOPE_ID != ''
        env:
          SUBSTRAT_SERVICE_TOKEN: ${{ secrets.SUBSTRAT_SERVICE_TOKEN }}
          SUBSTRAT_CP_URL: https://console.substrat.net/api
          # Through env, not ${{ }} inside the script: an expression is substituted into the
          # script TEXT before bash parses it, so a variable containing shell syntax would run
          # as a command — here beside a live SUBSTRAT_SERVICE_TOKEN. A repository variable is
          # set by a maintainer rather than a stranger, which lowers the odds, not the rule.
          SUBSTRAT_TEST_SCOPE_ID: ${{ vars.SUBSTRAT_TEST_SCOPE_ID }}
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./demos/auth-server/package.json').version")
          npx @substrat-run/cli push demos/auth-server --slug auth-server --version "$BASE-test.${{ github.run_number }}" | tee push.out
          # '|| true' so an unmatched grep does not trip pipefail before the message below —
          # "could not read the pushed version id" beats a bare exit 1 from grep.
          VID=$(grep -F '✓ pushed' push.out | grep -oE 'version [A-Za-z0-9]+' | head -1 | cut -d' ' -f2 || true)
          if [ -z "$VID" ]; then echo "could not read the pushed version id from:" >&2; cat push.out >&2; exit 1; fi
          npx @substrat-run/cli scope bind "$SUBSTRAT_TEST_SCOPE_ID" --version "$VID" --snapshot

