name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before the build, because a cycle makes the build's result a coin flip:
      # pnpm cannot order one, so it builds the members in parallel and whether
      # that passes depends on which tsc wins. Reading the declared graph gives
      # the same answer every time, and names the cycle instead of a stray TS2307.
      - run: node tools/workspace-cycles.mjs
      - run: pnpm -r build
      # The layer rules run from packages/boundary-lint (published as
      # @substrat-run/boundary-lint), so they need the build above — the repo
      # lints itself with the same code a from-scratch vertical runs.
      - run: node tools/boundary-lint.mjs
      # Every module a package references must be one it DECLARED
      # (docs/design/dependency-policy.md). Needs the build above, because the
      # sharp half of the check reads emitted `.d.ts`: TypeScript writes the
      # ORIGINAL specifier into declarations however the source imported it, so
      # a package's published types can require a module its package.json never
      # mentions. contract-tests shipped 130 `import("zod")` that way.
      - run: node tools/declared-deps.mjs
      # The permission-diff human checkpoint (CLAUDE.md). Re-emit every vertical's
      # snapshot and fail if it drifts from what is checked in — an agent that
      # widened a role must show it in the PR diff, not in a console nobody opens.
      # Needs the build above: it imports the engines' manifests.
      - run: pnpm lint:permissions --check
      # The API-surface checkpoint (design/api-surface.md §2.4): re-emit each
      # opted-in vertical's OpenAPI document from its operation catalog and fail
      # on drift — a surface change must appear in the PR diff.
      - run: pnpm lint:api --check
      # The entity-model checkpoint (#697): re-emit each adopting vertical's
      # model.json from its declared entities and fail on drift — a changed table,
      # a renamed field or a moved parent edge must appear in the PR diff. Exits 2
      # if no vertical declares entities, so the checkpoint can never pass by
      # scanning nothing.
      - run: pnpm lint:model --check
      # The playbook-sync checkpoint: the create-substrat template playbook is a
      # hand-adapted copy of the substrat skill, so fail if the skill moved without
      # a human re-reconciling the playbook (tools/playbook-sync.mts).
      - run: pnpm lint:playbook --check
      # The docs-freshness checkpoint (#750). Two mechanical questions: does every
      # published package have a reference page, and has any page fallen so far
      # behind its source that it is no longer describing it. Needs no build —
      # it reads git history and the filesystem.
      - run: pnpm lint:docs --check
      # The machine-readable-docs checkpoint (#751). llms.txt is emitted from the
      # sidebar, so a page nobody added there is invisible to every agent while
      # looking perfectly fine when a human opens it. Also fails on a page whose
      # index line cannot be derived — one that opens on a table, or on a fragment
      # too short to tell seven identically-titled engine pages apart.
      - run: pnpm lint:llms --check
      # The rules a vertical must not violate ship in two places: create-substrat's
      # AGENTS.md, and the published page an agent reads when it never scaffolded
      # anything. Unlike lint:playbook — which guards two documents that diverge on
      # purpose — these must read identically, so this re-emits and diffs.
      - run: pnpm lint:agent-rules --check
      # The dev-server checkpoint (#752). `.claude/launch.json` is what lets an
      # agent start the API and the web app and verify its own change in the
      # Browser pane — the one part of a demo the scenario tests never touch,
      # because they compose the host directly and never boot server.ts. It is
      # emitted from each project's `substrat.devServers` block with the port read
      # out of the file that binds it, so a moved port reddens here rather than
      # failing an agent's boot with `autoPort: false`.
      - run: pnpm lint:launch --check
      # The agent-plugin checkpoint (#753). The plugin reaches the projects the
      # scaffold never did, and everything in it routes except the SessionStart
      # hook — a script cannot be routed to, so it is emitted from the template's
      # copy. They must stay byte-identical: the script decides at runtime which
      # copy it is and the plugin's stays silent when the project owns one, which
      # only holds while they really are the same file. Also fails when the
      # plugin's version moves in its manifest but not in the catalog users
      # install from, which ships as "no update available" to everyone on it.
      - run: pnpm lint:plugin --check
      # The scaffold-pin checkpoint. `create-substrat` writes dependency ranges
      # into every new project, hand-copied from versions changesets moves on
      # every release. A caret on 0.x locks the minor, so a stale pin does not
      # drift forward — it freezes new projects on packages nobody ships, which
      # is how the template's own scenario test stayed green for four minors
      # while the engine surface moved underneath it. `version-packages` runs
      # the write, so this only reddens on a hand edit.
      - run: pnpm lint:pins --check
      - run: pnpm -r typecheck
      # The rule this job exists to enforce: the pure-SQLite adapter stays
      # green in CI forever (master plan D-14). Contract tests + the FSM
      # demo's nine-step scenario.
      - run: pnpm -r test

  # Deploy the prod apps to the shared TEST environment on every green push to
  # main. Prod itself is deployed separately, only on an actual changeset
  # release (see release.yml) — main → test, changeset → prod.
  #
  # GATED OFF until the test environment exists. Set the repository VARIABLE
  # TEST_ENV_READY=true to enable. Prerequisites before flipping it on:
  #   1. `wrangler d1 create substrat-control-plane-auth-test` — paste its id into
  #      apps/control-plane/wrangler.jsonc `env.test.d1_databases` (replaces the
  #      REPLACE_WITH_… placeholder; deploy fails on the placeholder on purpose).
  #      `wrangler dispatch-namespace create substrat-verticals-test`
  #   2. `[env.test]` blocks in each app's wrangler.jsonc — already added; they
  #      override routes + the D1 / dispatch / service bindings so test never binds
  #      prod. The two-level router host `*.global.test.substrat.run` also needs an
  #      ACM advanced cert + proxied DNS (see that block's comment).
  #   3. per-worker test secrets (OIDC_*/SESSION_SECRET/CP_SERVICE_TOKEN via
  #      `wrangler secret put … --env test`) — secrets are never inherited.
  # The `cf:deploy:test` scripts each app calls below already exist.
  deploy-test:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && vars.TEST_ENV_READY == 'true' }}
    runs-on: ubuntu-latest
    concurrency: deploy-test # never overlap two test deploys
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workers bundle the built @substrat-run/* dist, so build the workspace first.
      - run: pnpm -r build
      # control-plane owns the dispatch namespace the router/dashboard read, so it
      # deploys first; each step fails fast (no continue-on-error) on a bad deploy.
      - run: pnpm --filter @substrat-run/control-plane cf:deploy:test
      # Outbound worker for the test dispatch namespace (#442) — before the router, which
      # names it in `dispatch_namespaces.outbound`.
      - run: pnpm --filter @substrat-run/vertical-egress cf:deploy:test
      - run: pnpm --filter @substrat-run/router cf:deploy:test
      - run: pnpm --filter @substrat-run/dashboard cf:deploy:test
      - run: pnpm --filter @substrat-run/docs cf:deploy:test
