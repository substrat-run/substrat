name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          # Node 24 bundles npm 11.x — trusted publishing needs >= 11.5.1, and a
          # bundled npm avoids the version skew a global upgrade introduces.
          node-version: 24
          # OIDC needs the registry configured here, not just at publish time.
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # With pending changesets: opens/updates the "Version Packages" PR.
      # Without: `pnpm release` publishes any package whose version is not yet on
      # npm, tokenless via each package's trusted-publisher config (provenance is
      # automatic). We publish with `pnpm publish -r` rather than
      # `changeset publish`: with OIDC available, changesets publishes through npm
      # but still passes pnpm's --git-checks flag, which npm 11 rejects outright
      # (EUNKNOWNCONFIG). pnpm skips already-published versions on its own.
      - uses: changesets/action@v1
        id: changesets
        with:
          publish: pnpm release
          commit: "Version packages"
          title: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deploy the prod apps to PROD, but only on the run that actually published
      # a release — `published` is false on the runs that merely open/update the
      # "Version Packages" PR. So: merge to main → test (ci.yml); cut a changeset
      # release → prod (here), from the exact commit that was published.
      #
      # The Workers bundle the built @substrat-run/* dist, so build first. Both
      # build + deploy are gated on `published` so an ordinary main push pays
      # nothing. control-plane deploys first — it owns the dispatch namespace the
      # router/dashboard resolve against; each step fails fast on a bad deploy.
      - name: Build for prod deploy
        if: steps.changesets.outputs.published == 'true'
        run: pnpm -r build
      - name: Deploy control-plane
        if: steps.changesets.outputs.published == 'true'
        run: pnpm --filter @substrat-run/control-plane cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy router
        if: steps.changesets.outputs.published == 'true'
        run: pnpm --filter @substrat-run/router cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy dashboard
        if: steps.changesets.outputs.published == 'true'
        run: pnpm --filter @substrat-run/dashboard cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy docs
        if: steps.changesets.outputs.published == 'true'
        run: pnpm --filter @substrat-run/docs cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
