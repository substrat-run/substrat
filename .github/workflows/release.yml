name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          # Node 24 bundles npm 11.x — trusted publishing needs >= 11.5.1, and a
          # bundled npm avoids the version skew a global upgrade introduces.
          node-version: 24
          # OIDC needs the registry configured here, not just at publish time.
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # With pending changesets: opens/updates the "Version Packages" PR.
      # Without: `pnpm release` publishes any package whose version is not yet on
      # npm, tokenless via each package's trusted-publisher config (provenance is
      # automatic). We publish with `pnpm publish -r` rather than
      # `changeset publish`: with OIDC available, changesets publishes through npm
      # but still passes pnpm's --git-checks flag, which npm 11 rejects outright
      # (EUNKNOWNCONFIG). pnpm skips already-published versions on its own.
      #
      # The trailing `changeset tag` in `pnpm release` is what makes the action set
      # `outputs.published`: it decides that by parsing `New tag:` lines, which
      # `pnpm publish -r` never prints on its own (the bug that kept stale bundles
      # on console/app.substrat.net through several releases). Note the prod-deploy
      # gate below no longer relies on this alone — it also fires on the
      # `Version packages` release commit, so an app-only release still deploys.
      - uses: changesets/action@v1
        id: changesets
        with:
          publish: pnpm release
          commit: "Version packages"
          title: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Decide whether this run is a release that should deploy prod.
      #
      # `published` alone is wrong: it's parsed from `New tag:` lines, so an
      # app-only release (only private packages like @substrat-run/dashboard bump —
      # nothing publishes to npm, no tag) leaves it false and every deploy below
      # silently skips (#451). The honest signal is "the Version Packages PR just
      # merged": changesets squash-lands it as a commit titled `Version packages`,
      # true whether or not npm packages published. We OR the two so we never
      # regress the npm-publish path and also catch app-only releases. head_commit
      # is only read inside startsWith() (a GHA expression), never handed to the
      # shell — so no injection risk from a commit message.
      - name: Gate prod deploy on a release commit
        id: gate
        run: echo "release=${{ (steps.changesets.outputs.published == 'true' || startsWith(github.event.head_commit.message, 'Version packages')) && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"

      # Deploy the prod apps to PROD, but only on the run that landed a release —
      # false on the runs that merely open/update the "Version Packages" PR. So:
      # merge to main → test (ci.yml); cut a changeset release → prod (here),
      # from the exact commit that was released.
      #
      # The Workers bundle the built @substrat-run/* dist, so build first. Both
      # build + deploy are gated on the release signal so an ordinary main push
      # pays nothing. control-plane deploys first — it owns the dispatch namespace
      # the router/dashboard resolve against; each step fails fast on a bad deploy.
      - name: Build for prod deploy
        if: steps.gate.outputs.release == 'true'
        run: pnpm -r build
      - name: Deploy control-plane
        if: steps.gate.outputs.release == 'true'
        run: pnpm --filter @substrat-run/control-plane cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # The dispatch namespace's outbound worker (#442). Deploys BEFORE the router: the
      # router names it in `dispatch_namespaces.outbound`, and the egress worker holds a
      # service binding back to the already-live router — so the pair settles router → egress → router.
      - name: Deploy vertical-egress
        if: steps.gate.outputs.release == 'true'
        run: pnpm --filter @substrat-run/vertical-egress cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy router
        if: steps.gate.outputs.release == 'true'
        run: pnpm --filter @substrat-run/router cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy dashboard
        if: steps.gate.outputs.release == 'true'
        run: pnpm --filter @substrat-run/dashboard cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy docs
        if: steps.gate.outputs.release == 'true'
        run: pnpm --filter @substrat-run/docs cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
